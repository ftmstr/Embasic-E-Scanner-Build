name: Windows .NET Foundation
on:
  push:
    paths: ['windows/**', '.github/workflows/windows-build.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile contracts
        run: dotnet build windows/Embasic.EScanner.Contracts/Embasic.EScanner.Contracts.csproj -c Release
      - name: Run synthetic contract assertions
        run: dotnet run --project windows/Embasic.EScanner.SelfTest/Embasic.EScanner.SelfTest.csproj -c Release
