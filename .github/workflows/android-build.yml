name: Android Kotlin Foundation
'on':
  push:
    paths: ['android/**', '.github/workflows/android-build.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check for reviewed Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f android/gradle/wrapper/gradle-wrapper.jar ]]; then
            echo 'BLOCKED: Android wrapper provenance not approved; no downloaded or private wrapper binary is trusted.'
            exit 1
          fi
      - name: Android unit tests and lint (after source audit)
        shell: bash
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
