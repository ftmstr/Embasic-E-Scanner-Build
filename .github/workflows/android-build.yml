            --cache "${GRADLE_USER_HOME:-$HOME/.gradle}/caches/modules-2/files-2.1" \
            --output "${RUNNER_TEMP}/android-resolved-jar-hashes.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "android-resolved-jar-hashes.json"
          result = json.loads(p.read_text(encoding="utf-8"))
          assert result["sourceVerification"] == "LOCAL_SHA256_ONLY"
          assert result["transitiveLicenseClosure"] == "NOT_VERIFIED"
          assert result["releaseApproved"] is False
          print("HASHED_CACHED_MAVEN_ARTIFACTS:", result["artifactCount"])
          print("NOT VERIFIED: remote Maven publication, binary provenance, package license rights or release")
          PY
      - name: Verify four Android runtime/test Maven JARs against official HTTPS source bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_maven_release_jar_bytes.py' -v
          python3 scripts/audit_maven_release_jar_bytes.py \
            --inventory "${RUNNER_TEMP}/android-resolved-jar-hashes.json" \
            --output "${RUNNER_TEMP}/android-official-jar-byte-parity.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                               "android-official-jar-byte-parity.json").read_text())
          assert report["status"] == "SOURCE_BYTE_PARITY_PASS"
          assert report["sourceByteMatches"] == 4
          assert report["unverifiedSources"] == 0
          assert report["originAttributionVerified"] is False
          assert report["publisherSignatureVerified"] is False
          assert report["licenseClosure"] == "NOT_VERIFIED"
          assert report["releaseApproved"] is False
          for x in report["artifacts"]:
              print("MAVEN_OFFICIAL_BYTES_MATCH:", x["purl"], x["sourceSha256"], x["sourceUrl"])
          print("NOT VERIFIED: upstream publisher signatures, legal license closure, SBOM or APK")
          PY
