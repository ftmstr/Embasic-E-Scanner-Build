name: Android Kotlin Foundation
'on':
  push:
    paths: ['android/**', '.github/workflows/android-build.yml', 'scripts/audit_android_dependency_graph.py', 'tests/test_android_dependency_graph.py', 'scripts/audit_android_cached_artifacts.py', 'tests/test_android_cached_artifacts.py', 'scripts/audit_gradle_plugin_graph.py', 'tests/test_gradle_plugin_graph.py', 'scripts/audit_gradle_plugin_artifacts.py', 'tests/test_gradle_plugin_artifacts.py', 'scripts/audit_missing_maven_pom_sources.py', 'tests/test_missing_maven_pom_sources.py', 'scripts/audit_maven_release_jar_bytes.py', 'tests/test_maven_release_jar_bytes.py', 'scripts/audit_pinned_gradle_plugin_jars.py', 'tests/test_pinned_gradle_plugin_jars.py', 'scripts/audit_gradle_central_binary_batch.py', 'tests/test_gradle_central_binary_batch.py', 'scripts/audit_gradle813_classifier_jars.py', 'tests/test_gradle813_classifier_jars.py', 'scripts/reconcile_gradle_pom_license_gaps.py', 'tests/test_reconcile_gradle_pom_license_gaps.py', 'scripts/audit_jaf120_exact_license.py', 'tests/test_jaf120_exact_license.py', 'THIRD-PARTY-NOTICES.md']
  pull_request:
    paths: ['android/**', '.github/workflows/android-build.yml', 'scripts/audit_android_dependency_graph.py', 'tests/test_android_dependency_graph.py', 'scripts/audit_android_cached_artifacts.py', 'tests/test_android_cached_artifacts.py', 'scripts/audit_gradle_plugin_graph.py', 'tests/test_gradle_plugin_graph.py', 'scripts/audit_gradle_plugin_artifacts.py', 'tests/test_gradle_plugin_artifacts.py', 'scripts/audit_missing_maven_pom_sources.py', 'tests/test_missing_maven_pom_sources.py', 'scripts/audit_maven_release_jar_bytes.py', 'tests/test_maven_release_jar_bytes.py', 'scripts/audit_pinned_gradle_plugin_jars.py', 'tests/test_pinned_gradle_plugin_jars.py', 'scripts/audit_gradle_central_binary_batch.py', 'tests/test_gradle_central_binary_batch.py', 'scripts/audit_gradle813_classifier_jars.py', 'tests/test_gradle813_classifier_jars.py', 'scripts/reconcile_gradle_pom_license_gaps.py', 'tests/test_reconcile_gradle_pom_license_gaps.py', 'scripts/audit_jaf120_exact_license.py', 'tests/test_jaf120_exact_license.py', 'THIRD-PARTY-NOTICES.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check for reviewed Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -x android/gradlew || { echo '::error::Android gradlew missing or not executable'; exit 2; }
          cd android
          test -f gradle/wrapper/gradle-wrapper.jar || { echo '::error::Missing reviewed wrapper JAR'; exit 2; }
          grep -Fx 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.6-bin.zip' gradle/wrapper/gradle-wrapper.properties
          grep -Fx 'distributionSha256Sum=7988ed071b2a07900e2ec715fca15c6ab72bce6db433af301fa7fa7e9407bd24' gradle/wrapper/gradle-wrapper.properties
          grep -Fx 'ad16bca46cb71bb5887c546860d93992aeee35c1fdaf4a242b0a612375d937e0' gradle/wrapper/gradle-wrapper.jar.sha256
          sha256sum --check <<'SHA256'
          ad16bca46cb71bb5887c546860d93992aeee35c1fdaf4a242b0a612375d937e0  gradle/wrapper/gradle-wrapper.jar
          SHA256
      - name: Android unit tests and lint (after source audit)
        shell: bash
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Require executed JUnit test cases (not NO-SOURCE)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          xmls = list(Path("android/app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          if not xmls:
              raise SystemExit("BLOCKED: JUnit XML absent; task may have been NO-SOURCE")
          tests = failures = errors = skipped = 0
          for xml in xmls:
              root = ET.parse(xml).getroot()
              tests += int(root.get("tests", "0"))
              failures += int(root.get("failures", "0"))
              errors += int(root.get("errors", "0"))
              skipped += int(root.get("skipped", "0"))
          print(f"JUnit cases={tests}, failures={failures}, errors={errors}, skipped={skipped}")
          if tests == 0 or failures or errors or skipped:
              raise SystemExit("BLOCKED: JUnit not fully executed or not passing")
          PY
      - name: Inspect JVM test-only licensing boundary (not an SBOM)
        shell: bash
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath > "${RUNNER_TEMP}/android-debug-runtime-deps.txt"
          ./gradlew --no-daemon :app:dependencies --configuration debugUnitTestRuntimeClasspath > "${RUNNER_TEMP}/android-jvm-test-deps.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          folder = Path(os.environ["RUNNER_TEMP"])
          release = (folder / "android-debug-runtime-deps.txt").read_text()
          testing = (folder / "android-jvm-test-deps.txt").read_text()
          require_test = ("junit:junit:4.13.2", "org.hamcrest:hamcrest-core:1.3")
          if not all(value in testing for value in require_test):
              raise SystemExit("BLOCKED: reviewed JUnit/Hamcrest test graph changed")
          if any(value in release for value in require_test):
              raise SystemExit("BLOCKED: EPL JUnit or BSD Hamcrest leaked into production runtime")
          print("PASS: 2 reviewed test-only modules isolated from debugRuntimeClasspath")
          print("NOT VERIFIED: full transitive license inventory, binary provenance, release SBOM")
          PY
      - name: Collect resolved Gradle plugin buildEnvironment evidence (not SBOM)
        shell: bash
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon buildEnvironment :app:buildEnvironment > "${RUNNER_TEMP}/gradle-build-environment.txt"
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          path = Path(os.environ["RUNNER_TEMP"]) / "gradle-build-environment.txt"
          raw = path.read_bytes()
          print("PLUGIN_GRAPH_CAPTURE_BYTES:", len(raw))
          print("PLUGIN_GRAPH_CAPTURE_SHA256:", hashlib.sha256(raw).hexdigest())
          lines = raw.decode("utf-8", errors="replace").splitlines()
          for line in lines:
              if (line.startswith("> Task ") or line.startswith("classpath -")
                      or line.startswith("BUILD SUCCESSFUL") or "No dependencies" in line):
                  print("PLUGIN_GRAPH_STRUCTURE:", line[:200])
          coords = sorted(set(re.findall(
              r"[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+:[0-9][A-Za-z0-9_.-]*", "\n".join(lines))))
          print("PLUGIN_GRAPH_COORDINATE_CANDIDATES:", len(coords))
          for coordinate in coords[:12]:
              print("PLUGIN_GRAPH_SAMPLE:", coordinate)
          print("NOT VERIFIED: plugin/build tool full transitive licensing or SBOM")
          PY
      - name: Audit pinned root and app Gradle plugin buildEnvironment graph
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_gradle_plugin_graph.py' -v
          python3 scripts/audit_gradle_plugin_graph.py \
            --input "${RUNNER_TEMP}/gradle-build-environment.txt" \
            --output "${RUNNER_TEMP}/gradle-plugin-partial-inventory.json"
          echo '::notice::Plugin graph coordinates recorded; binary license and complete SBOM NOT VERIFIED'
      - name: Audit scoped Gradle plugin local artifact bytes and POM claims
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_gradle_plugin_artifacts.py' -v
          python3 scripts/audit_gradle_plugin_artifacts.py \
            --graph "${RUNNER_TEMP}/gradle-plugin-partial-inventory.json" \
            --cache "${GRADLE_USER_HOME:-$HOME/.gradle}/caches/modules-2/files-2.1" \
            --notice THIRD-PARTY-NOTICES.md \
            --output "${RUNNER_TEMP}/gradle-plugin-artifact-evidence.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "gradle-plugin-artifact-evidence.json"
          data = json.loads(p.read_text(encoding="utf-8"))
          counts = data["counts"]
          assert counts["modules"] == counts["withLocalBytes"] + counts["withoutLocalBytes"]
          assert data["status"] == "PASS_WITH_GAPS"
          assert data["partialNoticeCheck"] == "PASS"
          assert data["releaseApproved"] is False and data["sbomComplete"] is False
          assert data["licenseApproval"] == "NOT_VERIFIED" and data["originVerified"] is False
          print("PLUGIN_CACHE_HASHED:", counts["hashedFiles"])
          classifier_rows = [
              (module["purl"], entry) for module in data["modules"]
              for entry in module.get("cachedFiles", [])
              if entry.get("classifier") is not None
          ]
          assert counts["classifierJarFiles"] == len(classifier_rows)
          assert counts["classifierJarModules"] == len({p for p, _ in classifier_rows})
          assert counts["classifierJarFiles"] >= 1
          assert all(entry["binaryOrigin"] == "NOT_VERIFIED"
                     and entry["sourceVerification"] == "LOCAL_BYTES_ONLY"
                     for _, entry in classifier_rows)
          print("CLASSIFIER_JAR_FILES_LOCAL_SHA:", len(classifier_rows))
          print("CLASSIFIER_JAR_MODULES:", counts["classifierJarModules"])
          for purl, entry in classifier_rows:
              print("CLASSIFIER_UNVERIFIED_LOCAL_SHA:", purl,
                    entry["filename"], entry["sha256"], entry["classifier"])
          print("PLUGIN_CACHE_UNVERIFIED_MODULES:", counts["withoutLocalBytes"])
          print("PLUGIN_POM_LICENSING_METADATA_ROWS:", counts["pomWithLicenseNames"])
          gaps = data["missingDirectLicenseEvidence"]
          assert len(gaps) == counts["modules"] - counts["pomWithLicenseNames"]
          assert data["parentLicenseInheritanceVerified"] is False
          print("POM_GAP_REASON_COUNTS:", {k: counts[k] for k in
                ("pomNotCached", "pomWithoutDirectLicenseName", "unreadablePom",
                 "pomHasUnresolvedParent")})
          by_purl = {x["purl"]: x for x in data["modules"]}
          observed_parents = 0
          for gap in gaps:
              module = by_purl[gap["purl"]]
              chains = module.get("parentPomEvidence", [])
              print("POM_LICENSE_GAP:", gap["purl"], gap["reason"],
                    "PARENT_UNVERIFIED:", ",".join(gap["unresolvedPomParents"]))
              for chain in chains:
                  for parent in chain:
                      observed_parents += 1
                      print("PARENT_POM_EVIDENCE:", gap["purl"], parent["coordinate"],
                            parent["status"], parent["sha256"],
                            ",".join(parent["unverifiedLicenseNames"]))
                      assert parent["licenseApproved"] is False
          print("UNVERIFIED_PARENT_POM_EVIDENCE_RECORDS:", observed_parents)
          print("NOT VERIFIED: POM parent inheritance, publisher identity, legal rights, SBOM")
          print("NOT VERIFIED: publication origin, complete transitive notices and signing")
          PY
      - name: Verify pinned AGP and Kotlin Gradle build-tool JARs from official HTTPS source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_pinned_gradle_plugin_jars.py' -v
          python3 scripts/audit_pinned_gradle_plugin_jars.py \
            --plugin-inventory "${RUNNER_TEMP}/gradle-plugin-artifact-evidence.json" \
            --cache "${GRADLE_USER_HOME:-$HOME/.gradle}/caches/modules-2/files-2.1" \
            --output "${RUNNER_TEMP}/android-pinned-plugin-jar-byte-parity.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "android-pinned-plugin-jar-byte-parity.json"
          x = json.loads(path.read_text(encoding="utf-8"))
          assert x["selectedPinnedPluginJarCount"] == 2
          assert x["sourceByteMatches"] + x["unverifiedPinnedPluginJars"] == 2
          assert x["status"] in ("SOURCE_BYTE_PARITY_PASS", "PARTIAL_EVIDENCE_ONLY")
          assert x["publisherSignatureVerified"] is False
          assert x["originAttributionVerified"] is False
          assert x["licenseClosure"] == "NOT_VERIFIED"
          assert x["sbomComplete"] is False and x["releaseApproved"] is False
          inventory = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                                  "gradle-plugin-artifact-evidence.json").read_text())
          kotlin = next(m for m in inventory["modules"] if
                        m["purl"] == "pkg:maven/org.jetbrains.kotlin/kotlin-gradle-plugin@2.3.21")
          classified = [entry for entry in kotlin.get("cachedFiles", [])
                        if entry["filename"] == "kotlin-gradle-plugin-2.3.21-gradle813.jar"]
          assert len(classified) == 1
          candidate = classified[0]
          assert candidate["classifier"] == "gradle813"
          assert candidate["binaryOrigin"] == "NOT_VERIFIED"
          pinned = next(r for r in x["records"] if
                        r["purl"] == kotlin["purl"])
          assert candidate["sha256"] == pinned["localSha256"]
          assert candidate["byteSize"] == pinned["localByteSize"]
          if pinned["status"] == "SOURCE_BYTES_MATCH_LOCAL":
              assert candidate["sha256"] == pinned["remoteSha256"]
          print("KOTLIN_CLASSIFIER_INVENTORY_CROSSCHECK:", candidate["sha256"],
                pinned["status"])
          print("PINNED_PLUGIN_JARS_MATCHED:", x["sourceByteMatches"])
          print("PINNED_PLUGIN_JARS_NOT_VERIFIED:", x["unverifiedPinnedPluginJars"])
          for record in x["records"]:
              print("PINNED_PLUGIN_ORIGIN:", record["purl"], record["status"],
                    record["remoteSha256"] or "NO_REMOTE_HASH", record["repositoryUrl"])
          print("NOT VERIFIED: 147-module publisher provenance and entire plugin license inventory")
          PY
      - name: Verify two additional Kotlin gradle813 classifier JARs against exact official Maven Central bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_gradle813_classifier_jars.py' -v
          python3 scripts/audit_gradle813_classifier_jars.py \
            --plugin-inventory "${RUNNER_TEMP}/gradle-plugin-artifact-evidence.json" \
            --output "${RUNNER_TEMP}/gradle813-other-two-classifier-byte-evidence.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          directory = Path(os.environ["RUNNER_TEMP"])
          evidence = json.loads((directory / "gradle813-other-two-classifier-byte-evidence.json").read_text())
          inventory = json.loads((directory / "gradle-plugin-artifact-evidence.json").read_text())
          expected = {
              "pkg:maven/org.jetbrains.kotlin/fus-statistics-gradle-plugin@2.3.21":
                  "73379b384d9da66419b5f4d5c83de1a99dd7f195662bc45c39443859e63e18b2",
              "pkg:maven/org.jetbrains.kotlin/kotlin-gradle-plugin-api@2.3.21":
                  "ad58d2638ee041f6ce4e73e9782ebf528e18cf9003b1099aa7045ec958e3c195",
          }
          assert evidence["selectedClassifierCount"] == 2
          assert evidence["sourceByteMatches"] == 2 and evidence["notSourceVerified"] == 0
          assert evidence["status"] == "SOURCE_BYTE_PARITY_PASS"
          assert {row["purl"] for row in evidence["records"]} == set(expected)
          assert inventory["counts"]["classifierJarFiles"] == 3
          assert inventory["counts"]["hashedFiles"] == 295
          for row in evidence["records"]:
              assert row["status"] == "SOURCE_BYTES_MATCH_LOCAL"
              assert row["officialSha256"] == row["localSha256"] == expected[row["purl"]]
              assert row["officialByteSize"] == row["localByteSize"]
              module = next(m for m in inventory["modules"] if m["purl"] == row["purl"])
              cached = [f for f in module["cachedFiles"] if f["filename"] == row["filename"]]
              assert len(cached) == 1
              assert cached[0]["sha256"] == row["localSha256"]
              assert cached[0]["byteSize"] == row["localByteSize"]
              assert cached[0]["classifier"] == "gradle813"
              assert cached[0]["binaryOrigin"] == "NOT_VERIFIED"
              print("GRADLE813_OFFICIAL_BYTE_MATCH:", row["purl"], row["officialSha256"],
                    row["officialByteSize"], row["officialUrl"])
          assert evidence["publisherSignatureVerified"] is False
          assert evidence["originAttributionVerified"] is False
          assert evidence["parentLicenseInheritanceVerified"] is False
          assert evidence["licenseClosure"] == "NOT_VERIFIED"
          assert evidence["noticeClosure"] == "NOT_VERIFIED"
          assert evidence["sbomComplete"] is False and evidence["releaseApproved"] is False
          print("NOT VERIFIED: signed publisher provenance, license rights, NOTICE, SBOM or release")
          PY
      - name: Probe four distinct POM-license-gap Gradle JARs against Maven Central
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_gradle_central_binary_batch.py' -v
          python3 scripts/audit_gradle_central_binary_batch.py \
            --plugin-inventory "${RUNNER_TEMP}/gradle-plugin-artifact-evidence.json" \
            --output "${RUNNER_TEMP}/gradle-central-buildtool-jar-byte-evidence.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "gradle-central-buildtool-jar-byte-evidence.json"
          x = json.loads(p.read_text(encoding="utf-8"))
          assert x["selectedArtifactCount"] == 4
          assert x["sourceByteMatches"] + x["notSourceVerified"] == 4
          assert {r["purl"] for r in x["records"]} == {
              "pkg:maven/com.google.guava/failureaccess@1.0.2",
              "pkg:maven/com.google.protobuf/protobuf-java-util@3.25.5",
              "pkg:maven/com.google.jimfs/jimfs@1.1",
              "pkg:maven/com.google.auto.value/auto-value-annotations@1.6.2",
          }
          assert all(r["directPomLicenseMetadata"] == "POM_WITHOUT_DIRECT_LICENSE_NAME"
                     and r["licenseApproved"] is False for r in x["records"])
          assert x["status"] in ("SOURCE_BYTE_PARITY_PASS", "PARTIAL_EVIDENCE_ONLY")
          assert x["publisherSignatureVerified"] is False
          assert x["originAttributionVerified"] is False
          assert x["licenseClosure"] == "NOT_VERIFIED"
          assert x["noticeClosure"] == "NOT_VERIFIED"
          assert x["sbomComplete"] is False and x["releaseApproved"] is False
          print("GRADLE_CENTRAL_JARS_MATCHED:", x["sourceByteMatches"])
          print("GRADLE_CENTRAL_JARS_NOT_VERIFIED:", x["notSourceVerified"])
          for item in x["records"]:
              print("GRADLE_CENTRAL_BYTE:", item["purl"], item["status"],
                    item["officialSha256"] or "NO_REMOTE_HASH", item["officialSourceUrl"])
          print("NOT VERIFIED: full 147 modules, publisher signatures, licensing or SBOM")
          PY
      - name: Research exact missing child and parent POM metadata from official Maven HTTPS
        shell: bash
        continue-on-error: false
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_missing_maven_pom_sources.py' -v
          python3 scripts/audit_missing_maven_pom_sources.py \
            --plugin-report "${RUNNER_TEMP}/gradle-plugin-artifact-evidence.json" \
            --output "${RUNNER_TEMP}/gradle-missing-pom-source-research.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "gradle-missing-pom-source-research.json"
          result = json.loads(p.read_text(encoding="utf-8"))
          assert result["status"] == "PARTIAL_EVIDENCE_ONLY"
          assert result["releaseApproved"] is False
          assert result["originVerified"] is False
          assert result["artifactBinaryVerified"] is False
          assert result["parentLicenseInheritanceVerified"] is False
          assert result["licenseClosure"] == "NOT_VERIFIED"
          assert result["originalDirectLicenseGaps"] == 42
          assert result["targets"] <= 32
          print("POM_SOURCE_RESEARCH_TARGETS:", result["targets"])
          print("POM_SOURCE_RESEARCH_RETRIEVED:", result["remotePomMetadataRetrieved"])
          print("POM_SOURCE_RESEARCH_UNAVAILABLE:", result["stillUnretrieved"])
          print("NOT VERIFIED: source POM metadata is not artifact signature or license clearance")
          PY
      - name: Reconcile 42 selected Maven POM license gaps with bounded official-source research (NOT legal approval)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_reconcile_gradle_pom_license_gaps.py' -v
          python3 scripts/reconcile_gradle_pom_license_gaps.py \
            --plugin-report "${RUNNER_TEMP}/gradle-plugin-artifact-evidence.json" \
            --pom-research "${RUNNER_TEMP}/gradle-missing-pom-source-research.json" \
            --output "${RUNNER_TEMP}/gradle-pom-legal-review-queue.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "gradle-pom-legal-review-queue.json"
          report = json.loads(p.read_text(encoding="utf-8"))
          c = report["counts"]
          assert report["status"] == "REVIEW_QUEUE_ONLY_LEGAL_NO_GO"
          assert c["selectedModules"] == 147
          assert c["directPOMLicenseGaps"] == 42
          assert c["childPOMNotCached"] == 12
          assert c["childPOMWithoutDirectLicenseName"] == 30
          assert c["unreadableChildPOM"] == 0
          assert c["remoteResearchTargets"] <= 32
          assert len(report["reviewQueue"]) == 42
          assert all(item["evidenceOnly"] is True
                     and item["licenseApproved"] is False
                     and item["redistributionRightsVerified"] is False
                     for item in report["reviewQueue"])
          assert report["allChildGapsRemainUnresolved"] is True
          assert report["parentMetadataTextTriageNotALicenseConclusion"] is True
          assert c["parentEvidenceRows"] >= 1
          assert c["withComplexParentMetadataSignals"] >= 1
          flagged = [r for r in report["reviewQueue"]
                     if r["complexParentMetadataReviewRequired"]]
          assert len(flagged) == c["withComplexParentMetadataSignals"]
          for item in report["reviewQueue"]:
              evidence = item["cachedParentPOMReviewEvidence"]
              assert all(x["supplierMetadataOnly"] is True
                         and x["effectiveChildLicenseVerified"] is False
                         and x["licenseApproved"] is False for x in evidence)
              assert item["licenseApproved"] is False
              assert item["redistributionRightsVerified"] is False
          print("PARENT_POM_METADATA_REVIEW_ROWS:", c["parentEvidenceRows"])
          print("COMPLEX_PARENT_LICENSE_METADATA_REVIEW_ROWS:",
                c["withComplexParentMetadataSignals"])
          for row in flagged:
              print("PARENT_COMPLEX_REVIEW_NOT_APPROVAL:", row["purl"],
                    "|".join(row["complexParentLicenseMetadataNames"]))
          assert report["parentLicenseInheritanceVerified"] is False
          assert report["microsoftSDKBuildToolsExactRedistRights"] == "NOT_VERIFIED_SEPARATE_GATE"
          assert report["licenseClosure"] == "NOT_VERIFIED"
          assert report["noticeClosure"] == "NOT_VERIFIED"
          assert report["sbomComplete"] is False and report["releaseApproved"] is False
          print("LEGAL_REVIEW_QUEUE_SELECTED:", c["selectedModules"])
          print("LEGAL_REVIEW_QUEUE_GAPS:", c["directPOMLicenseGaps"])
          print("LEGAL_REVIEW_QUEUE_REMOTE_METADATA:", c["remoteMetadataRetrieved"])
          print("LEGAL_REVIEW_QUEUE_UNRESOLVED:", len(report["reviewQueue"]))
          print("NOT VERIFIED: 42 child license rights, exact Microsoft REDIST terms and product release")
          PY
      - name: Audit resolved app and test configurations (partial inventory)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_android_dependency_graph.py' -v
          python3 scripts/audit_android_dependency_graph.py \
            --runtime "${RUNNER_TEMP}/android-debug-runtime-deps.txt" \
            --test "${RUNNER_TEMP}/android-jvm-test-deps.txt" \
            --notice THIRD-PARTY-NOTICES.md \
            --output "${RUNNER_TEMP}/android-dependency-partial-inventory.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "android-dependency-partial-inventory.json"
          result = json.loads(p.read_text(encoding="utf-8"))
          assert result["graphAudit"] == "PASS"
          assert result["inventoryCompleteness"] == "PARTIAL"
          assert result["licenseClosure"] == "NOT_VERIFIED"
          assert result["noticeScopeCheck"] == "PASS"
          assert result["noticeCompleteness"] == "PARTIAL"
          assert result["releaseApproved"] is False
          print("PASS: resolved app/test module inventory and partial NOTICE consistency")
          print("COUNTS:", result["componentCounts"])
          print("BLOCKED: full Gradle plugin/build-tool graph, licenses and final SBOM")
          PY
      - name: Verify JAF 1.2.0 exact release-tag licence and embedded Maven JAR text (NOT rights clearance)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_jaf120_exact_license.py' -v
          python3 scripts/audit_jaf120_exact_license.py \
            --plugin-inventory "${RUNNER_TEMP}/gradle-plugin-artifact-evidence.json" \
            --review-queue "${RUNNER_TEMP}/gradle-pom-legal-review-queue.json" \
            --android-runtime "${RUNNER_TEMP}/android-dependency-partial-inventory.json" \
            --output "${RUNNER_TEMP}/jaf120-exact-source-license-evidence.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_${RUNNER_TEMP}"]) / "jaf120-exact-source-license-evidence.json"
          evidence = json.loads(p.read_text(encoding="utf-8"))
          assert evidence["status"] == "EXACT_JAF120_SOURCE_BYTES_AND_LICENSE_TEXT_MATCH_REVIEW_OPEN"
          assert evidence["purl"] == "pkg:maven/com.sun.activation/javax.activation@1.2.0"
          assert evidence["tag"]["name"] == "JAF-1_2_0"
          assert evidence["tag"]["commit"] == "8f8ec08d736983c839d31a7bd98d29594e508785"
          assert evidence["tag"]["licenseGitBlobSha1"] == "5ad62c442b336861b5832b7a8197a507b7df61f0"
          assert evidence["embeddedLicense"]["matchesExactTaggedLicenseBytes"] is True
          assert evidence["mavenJAR"]["matchesLocalGradleCache"] is True
          assert evidence["mavenParentPOM"]["supplierLicenseName"] == "CDDL/GPLv2+CE"
          assert evidence["licenseOptionSelected"] is False
          assert evidence["productRuntimeInclusionVerified"] is False
          assert evidence["parentLicenseInheritanceVerified"] is False
          assert evidence["publisherSignatureVerified"] is False
          assert evidence["all42ChildLicenseReviewGapsOpen"] is True
          assert evidence["microsoftSDKBuildToolsExactRedistRights"] == "NOT_VERIFIED_SEPARATE_GATE"
          assert evidence["licenseClosure"] == "NOT_VERIFIED"
          assert evidence["sbomComplete"] is False and evidence["releaseApproved"] is False
          print("JAF120_MAVEN_JAR_SHA256:", evidence["mavenJAR"]["sha256"])
          print("JAF120_TAG_LICENSE_SHA256:", evidence["tag"]["licenseSha256"])
          print("JAF120_BYTE_EQUALITY:", evidence["embeddedLicense"]["matchesExactTaggedLicenseBytes"])
          print("NOT VERIFIED: exact chosen licence, per-source header exception, signed provenance, APK packaging or legal permission")
          PY
      - name: Hash actual Gradle cached JARs from scoped resolved graph
