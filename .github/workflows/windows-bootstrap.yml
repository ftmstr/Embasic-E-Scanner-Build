name: Windows bootstrap
on:
  push:
    paths: ['windows/**', '.github/workflows/windows-bootstrap.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows-bootstrap.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build windows/Embasic.EScanner.Bootstrap/Embasic.EScanner.Bootstrap.csproj -c Release
      - run: dotnet run --project windows/Embasic.EScanner.Bootstrap/Embasic.EScanner.Bootstrap.csproj -c Release --no-build
