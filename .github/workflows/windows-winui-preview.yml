name: Windows WinUI3 workspace preview compile (NOT release)
'on':
  push:
    branches: [fix/pdf-fixture-selftest-20261018]
    paths:
      - 'windows/Embasic.EScanner.Desktop/**'
      - '.github/workflows/windows-winui-preview.yml'
  pull_request:
    paths:
      - 'windows/Embasic.EScanner.Desktop/**'
      - '.github/workflows/windows-winui-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  winui-preview:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore exact WinAppSDK 2.6.4 for PUBLIC WinUI3 preview
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore windows/Embasic.EScanner.Desktop/Embasic.EScanner.Desktop.csproj -p:Platform=x64 -p:RuntimeIdentifier=win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile unpackaged real WinUI3 XAML and C# workspace preview
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build windows/Embasic.EScanner.Desktop/Embasic.EScanner.Desktop.csproj -c Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'NOT VERIFIED: WinUI3 window launch, native visual QA, signed package, SDK REDIST, OCR or feature parity'
      - name: Run actual headless Windows raster PDF save/reopen/error-preservation smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The headless WinRT PDF decoder may be unavailable to CI's
          # noninteractive user session. Bound the probe so a blocked API
          # never consumes a whole runner. Failure remains FAIL/BLOCKED.
          $psi = [System.Diagnostics.ProcessStartInfo]::new('dotnet')
          foreach ($arg in @('run', '--project',
            'windows/Embasic.EScanner.PdfSmoke/Embasic.EScanner.PdfSmoke.csproj',
            '-c', 'Release', '-p:RuntimeIdentifier=win-x64')) {
            [void]$psi.ArgumentList.Add($arg)
          }
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $child = [System.Diagnostics.Process]::Start($psi)
          if ($null -eq $child) { throw 'NOT VERIFIED: PDF smoke process unavailable' }
          try {
            $stdout = $child.StandardOutput.ReadToEndAsync()
            $stderr = $child.StandardError.ReadToEndAsync()
            if (!$child.WaitForExit(180000)) {
              $child.Kill($true)
              throw 'BLOCKED: Windows headless PDF smoke exceeded bounded 180s; NOT VERIFIED'
            }
            Write-Output $stdout.GetAwaiter().GetResult()
            Write-Output $stderr.GetAwaiter().GetResult()
            if ($child.ExitCode -ne 0) { exit $child.ExitCode }
          } finally { $child.Dispose() }
          Write-Output 'NOT VERIFIED: interactive WinUI3 user flow, Android device PDF, rendered PDF visual QA or signed release'
